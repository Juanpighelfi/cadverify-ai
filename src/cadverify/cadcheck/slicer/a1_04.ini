# The print this harness assumes: a Bambu Lab A1 with its 0.4 mm nozzle, 0.2 mm layers, written from
# scratch for PrusaSlicer's engine. The machine's numbers are its public specification: a 256 mm
# cube, 500 mm/s and 10000 mm/s2 at most (Bambu Lab's A1 sheet,
# https://cdn.shopify.com/s/files/1/0635/8247/0318/files/A1_Spec_EN_1.pdf). The speeds below are
# this profile's own choice inside those limits, with no vendor profile behind them: a time from
# here is an estimate on them, not what the printer's firmware will report.
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
nozzle_diameter = 0.4
filament_diameter = 1.75
gcode_flavor = marlin2
use_relative_e_distances = 1
layer_gcode = G92 E0
elefant_foot_compensation = 0
machine_max_acceleration_extruding = 10000
machine_max_acceleration_x = 10000
machine_max_acceleration_y = 10000
machine_max_acceleration_z = 500
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
machine_max_feedrate_z = 20
machine_max_feedrate_e = 30
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 5
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
perimeter_generator = arachne
extrusion_width = 0.42
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.42
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.42
top_infill_extrusion_width = 0.42
first_layer_extrusion_width = 0.5
perimeter_speed = 200
external_perimeter_speed = 150
infill_speed = 270
solid_infill_speed = 250
top_solid_infill_speed = 200
bridge_speed = 50
gap_fill_speed = 100
small_perimeter_speed = 50
first_layer_speed = 50
first_layer_infill_speed = 100
travel_speed = 500
travel_speed_z = 12
perimeter_acceleration = 5000
external_perimeter_acceleration = 5000
infill_acceleration = 10000
solid_infill_acceleration = 7000
top_solid_infill_acceleration = 2000
bridge_acceleration = 2000
first_layer_acceleration = 500
travel_acceleration = 10000
default_acceleration = 10000
support_material = 0
skirts = 0
brim_width = 0
gcode_comments = 1
avoid_crossing_perimeters = 0
complete_objects = 0
